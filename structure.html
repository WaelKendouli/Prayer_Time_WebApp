<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Adhan Times</title>
	<link rel="stylesheet" href="styles.css">
    
</head>
<body>
	<div class="Dashboard">
		<h1>Adhan Times</h1>
		<p>Daily prayer times</p>
        <div class="SeacrhContainer">
            
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
  <circle cx="11" cy="11" r="8"></circle>
  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
</svg>

<input class="search_bar" type="text" id="city" name="city" placeholder="Enter your city">
            
            <div class="combobox-container">
  <label for="country-select" class="combobox-label">Choose a Country</label>
  <div class="combobox-wrapper">
    <input 
      type="text" 
      id="country-select" 
      list="countries" 
      placeholder="Type or select a country..." 
      class="combobox-input"
    />
    <span class="combobox-arrow">▼</span>
    
    <datalist id="countries">
      <option value="Afghanistan">
      <option value="Albania">
      <option value="Algeria">
      <option value="Andorra">
      <option value="Angola">
      <option value="Antigua and Barbuda">
      <option value="Argentina">
      <option value="Armenia">
      <option value="Australia">
      <option value="Austria">
      <option value="Azerbaijan">
      <option value="Bahamas">
      <option value="Bahrain">
      <option value="Bangladesh">
      <option value="Barbados">
      <option value="Belarus">
      <option value="Belgium">
      <option value="Belize">
      <option value="Benin">
      <option value="Bhutan">
      <option value="Bolivia">
      <option value="Bosnia and Herzegovina">
      <option value="Botswana">
      <option value="Brazil">
      <option value="Brunei">
      <option value="Bulgaria">
      <option value="Burkina Faso">
      <option value="Burundi">
      <option value="Cabo Verde">
      <option value="Cambodia">
      <option value="Cameroon">
      <option value="Canada">
      <option value="Central African Republic">
      <option value="Chad">
      <option value="Chile">
      <option value="China">
      <option value="Colombia">
      <option value="Comoros">
      <option value="Congo (Congo-Brazzaville)">
      <option value="Costa Rica">
    </datalist>
  </div>
</div>

          
    </div>
    </div>
    
	

</body>
</html>
