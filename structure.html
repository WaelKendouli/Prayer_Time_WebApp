<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Adhan Times</title>
</head>
<body>
	<header>
		<h1>Adhan Times</h1>
		<p>Daily prayer times</p>
	</header>

	<main>
		<section aria-labelledby="location-heading">
			<h2 id="location-heading">Your Location</h2>
			<label for="location">City</label>
			<input type="text" id="location" name="location" placeholder="Enter your city">
			<button type="button">Update Location</button>
		</section>

		<section aria-labelledby="date-heading">
			<h2 id="date-heading">Today's Prayer Times</h2>
			<p id="date">Select a location to view prayer times.</p>
			<table>
				<thead>
					<tr>
						<th scope="col">Prayer</th>
						<th scope="col">Time</th>
					</tr>
				</thead>
				<tbody>
					<tr><th scope="row">Fajr</th><td>--:--</td></tr>
					<tr><th scope="row">Dhuhr</th><td>--:--</td></tr>
					<tr><th scope="row">Asr</th><td>--:--</td></tr>
					<tr><th scope="row">Maghrib</th><td>--:--</td></tr>
					<tr><th scope="row">Isha</th><td>--:--</td></tr>
				</tbody>
			</table>
		</section>
	</main>

	<footer>
		<p>&copy; 2024 Adhan Times</p>
	</footer>
</body>
</html>
